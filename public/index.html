    <meta charset="utf-8" />
    <link rel="canonical" href="https://oficial.montironi.com/208/" />
    <script>
      (function () {
        var BLOCKED_SOURCE = "Diario Castellanos Agosto2023";
        var BLOCKED_MEDIUM = "208 Convencional 240x200";
        function normalizeUtm(value) {
          if (value == null || value === "") return null;
          try {
            return decodeURIComponent(String(value).replace(/\+/g, " ")).trim();
          } catch (e) {
            return String(value).replace(/\+/g, " ").trim();
          }
        }
        function isBlocked(source, medium) {
          return normalizeUtm(source) === BLOCKED_SOURCE && normalizeUtm(medium) === BLOCKED_MEDIUM;
        }
        function purgeBlocked() {
          if (
            isBlocked(sessionStorage.getItem("utm_source"), sessionStorage.getItem("utm_medium"))
          ) {
            sessionStorage.removeItem("utm_source");
            sessionStorage.removeItem("utm_medium");
          }
        }
        purgeBlocked();
        var search = window.location.search;
        if (!search) return;
        var params = new URLSearchParams(search);
        var utm_source = params.get("utm_source");
        var utm_medium = params.get("utm_medium");
        if (!isBlocked(utm_source, utm_medium)) return;
        purgeBlocked();
        params.delete("utm_source");
        params.delete("utm_medium");
        var query = params.toString();
        var path = window.location.pathname.replace(/\/?$/, "/");
        var newUrl = path + (query ? "?" + query : "") + window.location.hash;
        window.history.replaceState(null, "", newUrl);
      })();
    </script>
